server {
    listen 80;

    location /api/ {
        # Försök nå gateway internt via docker-nätverket
        proxy_pass http://gateway:8080;

        # Standard-headers som krävs för att Gateway ska förstå var anropet kommer ifrån
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Viktigt: Tillåt att headers skickas vidare
        proxy_pass_request_headers on;

        # Viktigt: Se till att anropet inte blir avbrutet
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}